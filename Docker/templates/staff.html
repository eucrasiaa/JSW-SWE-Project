#shift-container {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));

}

.shift-card {

    row-gap:10px;

}
.shift-courses {

    row-gap: 4px;
    justify-content: center;
    flex-wrap: wrap;
}
.shift-actions{
    width: 100%;
    position: sticky;
    margin-top: auto;
}
.shift-courses > .course-chip {
    border: 1px solid black;
    border-radius: 5px;
    padding: 3px;
    font-size: 14px;
    text-align: center;
    font-weight: 600;
}

.shift-actions {

.select-shift{

    border: 2px solid #222;
    font-weight: 700;
    font-size: 1rem;
    color: #222;
    cursor: pointer;
transition: all 0.05s ease;

    background-color: var(--bg-color, #fff); /* fallback */

}

.select-shift:hover {
    transform: scale(1.1);
    
}

.select-shift:active {
    /* transform: translate(0px, -4px); */
}

.shift-actions::after {
    content: '▼';
    font-size: 18px;
    position: absolute;
    right: 20px;
    top: 50%;
    transform: translateY(-50%) rotate(0deg);
    
    pointer-events: none; 
    color: #222;
    transition: 
        transform 0.05s ease;
}

.shift-actions:has(.select-shift:hover)::after {
    transform: scale(1.1) translateY(-50%) translateX(4px) rotate(0deg);
     /* transform:  */

}

/* content: '▲'; */
transform: scale(1.1) translateY(-50%) translateX(4px) rotate(180deg);

    <script>

      const dateInput = document.getElementById('view_date_sel');

      }

const template = document.getElementById('shift-card-template');
const container = document.getElementById('shift-container');
const tbody = document.getElementById('staff-table-body');

container.innerHTML = '';

        const statuses = ['Scheduled', 'Arrived', 'Late', 'Canceled', 'Full','Custom'];
let shifts;

      async function loadStaffDashboard(selectedDate) {

        //const response = await fetch('/api/shifts/today');
        //const shifts = await response.json();

        const dateObj = new Date(selectedDate);
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const dayName = days[dateObj.getUTCDay()]; //

        const response = await fetch(`/api/shifts?date=${selectedDate}&day=${dayName}`);
        shifts = await response.json();
        //tbody.innerHTML = '';
        container.innerHTML = '';

        // if none for the day. generally, if its a weekend this triggers lol``
        //WHY DOES ==[] ALWAYS EQUAL FALSSE IN JS WHAAAAT
        if (shifts.length === 0) {
          //tbody.innerHTML = `
          container.innerHTML = `
          <table>
                <tr>
                    <td colspan="4" style="text-align: center; padding: 20px; color: #666;">
                        <strong>No tutoring shifts scheduled for ${dayName}.</strong> 
                        <br>Try selecting another day?
                    </td>
                </tr>
          </table>
            `;
          return;
        }

        shifts.forEach(shift => {
          const clone = template.content.cloneNode(true);
          /*clone.id=`${shift.shift_id}`;*/
          const shiftElement = clone.firstElementChild; 
          shiftElement.id = `shift-${shift.shift_id}`; 
          clone.querySelector('.shift-time').textContent = `${shift.start_time} - ${shift.end_time}`;
          clone.querySelector('.shift-tutor').textContent = shift.tutor_name;
          //clone.querySelector('.shift-courses').textContent = shift.courses_taught || "None";
          const courseContainer = clone.querySelector('.shift-courses');
          const coursesRaw = shift.courses_taught || "";
          const courseSplit = coursesRaw.split(',').map(c => c.trim()).filter(c => c !== "");

          courseSplit.forEach(course => {
            const span = document.createElement('span');
            span.className = 'course-chip';
            span.textContent = course;
            courseContainer.appendChild(span);
          });
          let optionsHtml = statuses.map(s => {
            if (s==="Custom"){
              return `<option class="customone" value="${s}" ${shift.status === s ? 'selected' : ''}>${s}</option>`
            }
            else{
              return `<option value="${s}" ${shift.status === s ? 'selected' : ''}>${s}</option>`
            }
          }).join('');
          clone.querySelector('.select-shift').innerHTML = `${optionsHtml}`;
          clone.querySelector('.select-shift').onchange = function() {
            updateStatus(shift.shift_id, this.value);
          };

          container.appendChild(clone);
        });

          const tr = document.createElement('tr');

            `<option value="${s}" ${shift.status === s ? 'selected' : ''}>${s}</option>`
          ).join('');

          tr.innerHTML = `
                    <td>${shift.start_time} - ${shift.end_time}</td>
                    <td>${shift.tutor_name}</td>

                    <td>
                        <select onchange="updateStatus('${shift.shift_id}', this.value)">
                            ${optionsHtml}
                        </select>
                    </td>
                `;
          tbody.appendChild(tr);
        });
        */
                  await setCustomDropdown();

        

      }

async function setCustomDropdown() {
    try {
        const response = await fetch('http://localhost:4413/api/get_live_status');
        const liveStatuses = await response.json(); 
        const allCards = document.querySelectorAll('.shift-card');

        allCards.forEach(card => {
            const id = card.id.replace('shift-', '');
            const statusText = liveStatuses[id]; // safe? 
            const select = card.querySelector('.select-shift');
            const customOption = card.querySelector('.customone');

            if (statusText && select && customOption) {
                const isCustom = !statuses.includes(statusText);

                if (isCustom) {
                    customOption.textContent = statusText;
                    select.value = "Custom";
                } else {
                    select.value = statusText;
                    customOption.textContent = "Custom";
                }

            }
                          select.style.setProperty('--bg-color', getStatusColor(select.value));

        });
    } catch (error) {
        console.error("FAILLL!!!! to load custom statuses:", error);
    }
}

const getStatusColor = (status) => {
    const colors = {
        'Scheduled': 'var(--status-scheduled)',
        'Arrived': 'var(--status-arrived)',
        'Late': 'var(--status-late)',
        'Canceled': 'var(--status-canceled)',
        'Full': 'var(--status-full)',
        'Custom': 'var(--status-custom)'
    };
    return colors[status] || 'var(--status-custom)'; 
};

      function setCustomDropdownInsta(id, statuss){
        const outercard = document.getElementById(`shift-${id}`);
        if (outercard) {
          const customOption = outercard.querySelector('.customone');
          const select = outercard.querySelector('.select-shift');
          select.value=statuss;
        }

      }
      async function updateStatus(shiftId, newStatus) {
        let finalStatus = newStatus; 
        if (newStatus === "Custom") {
          const customValue = prompt("Enter custom status:");

          if (!customValue) {
            loadStaffDashboard();
            return;
          }
          finalStatus = customValue;
          //setCustomDropdownInsta(shiftId, customValue);

        }

        await fetch('/api/update_live_status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ shift_id: shiftId, status: finalStatus })
        });
        await setCustomDropdown();

        console.log(`Updated shift ${shiftId} to ${finalStatus}`);
      }
      loadStaffDashboard(todayStr);
