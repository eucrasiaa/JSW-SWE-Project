<!DOCTYPE html>
<html lang="en">
<!-- placeholder slop for testing LOL -->
<head>
    <meta charset="UTF-8">
    <title>Staff Dashboard - Cancellations</title>
    <style>
:root{
  --no-changes= "#28a745";
  --change=""
}
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background: #eee; }
        .remove-button {margin-left:40px}
        .datesel {display:flex;border: 2px solid black;align-content: center;justify-content: center;align-items: center;width: 50%; gap:10%;}
        
        .staff-header {
          display: flex;
          width: 100%; 
          box-shadow: 0 4px 8px rgba(0,0,0,0.25);
          border: 1px solid #999; 
        }

        .staff-btn {
          flex: 1;
          text-align: center;
          padding: 20px 0;
          text-decoration: none;
          font-family: Arial, sans-serif;
          font-weight: bold;
          font-size: 1.2rem;
          transition: 0.3s;
          border: none;
          background: linear-gradient(to bottom, #e0e0e0, #b8b8b8);
          color: black;
          border-right: 1px solid #aaa;
        }

        .staff-btn:last-child { 
          border-right: none; 
        } 

        .currPage{
          background: linear-gradient(to bottom, #808080, #5a5a5a);
          color: white;
          box-shadow: inset 0 3px 6px rgba(0,0,0,0.35);
        }

        .currPage span{
          text-decoration: none; 
          border-bottom: 2px solid white; 
          padding-bottom: 5px; 
          display: inline-block;
        }

        .staff-header:hover .currPage::before,
        .staff-header:hover .currPage::after {
          opacity: 0;
        }

        .staff-header .staff-btn:hover::before,
        .staff-header .staff-btn:hover::after {
          opacity: 1;
        }
        .staff-btn::before { content: "> "; opacity: 0; }
        .staff-btn::after { content: " <"; opacity: 0; }
        .currPage::before, 
        .currPage::after { 
          opacity: 1; 
        }
        .staff-btn:hover {
          filter: brightness(90%);
          cursor: pointer;
        }
    </style>
</head>
<body style="
    display: flex;
    flex-direction: column;
    align-content: center;
    align-items: center;">

  <header class="staff-header">
    <a href="/staff" class="staff-btn "><span>Update Live Status<span></a>
    <a href="/staff-cancel" class="staff-btn currPage"><span>Cancel Session<span></a>
        <a href="/staff-edit" class="staff-btn"><span>Edit Shifts</span></a>

</header>
    <h1>Staff Dashboard - Cancellations</h1>
    <div style="margin-top: 20px; display: flex; gap: 10px;">
    <button id="submit-btn" onclick="updateCancellations()" 
            style="padding: 10px 20px; background: #28a745; color: white; border: none; opacity: 0.5;" disabled>
        Submit 0 Changes
    </button>

    <button onclick="toggleVisualizer('pending')" style="padding: 10px; cursor: pointer;">View Pending Changes</button>
    <button onclick="toggleVisualizer('allcancel')" style="padding: 10px; cursor: pointer;">View All Cancelations</button>
</div>

<div id="visualizer-container" style="width: 80%; margin-top: 20px; padding: 0px 15px 15px 15px; border: 1px dashed #666; background: #f9f9f9;">
    <h3 id="viz-title">Pending Changes</h3>
    <div id="viz-content">No pending changes found.</div>
</div>

<p></p>

<div style="" class="datesel"><div><p>Select Date To Edit</p></div><div style="
    justify-content: flex-start;
">
<input id="cancel_date_sel" type="date">
</div></div>
    <table id="staff-live-table">
        <thead>
            <tr>
                <th>Time</th>
                <th>Tutor</th>
                <th>Courses</th>
                <th>Canceled?</th>
            </tr>
        </thead>
        <tbody id="staff-table-body">
            </tbody>
    </table>

    <script>


      let pendingChanges = {};
      let currentSelectedDate =  new Date().toISOString().split('T')[0];
      document.getElementById('cancel_date_sel').value = currentSelectedDate;

      let loaded = {};
      // todo this is such a terrible way to do it but also its working. so maybe 
      // make more boolean states for tracking buttttt who care

      document.getElementById('cancel_date_sel').addEventListener('change', (e) => {
        //const dateValue = e.target.value; 
        console.log("pressed!") 
        dateValue = e.target.value; 
        if (!dateValue) return;
        currentSelectedDate = dateValue;
        const date = new Date(dateValue);
        const dayIndex = date.getUTCDay(); 
        const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const dayName = days[dayIndex];

        loadStaffDashboard(currentSelectedDate, dayName);
      });

      async function loadStaffDashboard(currentSelectedDate, dayName) {
        //fallback to just today?
        const date = dayName || new Date().toISOString().split('T')[0];
        // was previously just doing Day of week. for some reason. pass full date!!!!
        const response = await fetch(`/api/shifts?date=${currentSelectedDate}&day=${dayName}`);
        const shifts = await response.json();
        loaded[currentSelectedDate] = shifts;
        const tbody = document.getElementById('staff-table-body');
        tbody.innerHTML = '';
        shifts.forEach(shift => {
          const tr = document.createElement('tr');
          // use the status from the exception table if it exists, otherwise default to 'scheduled'

          const currentStatus = pendingChanges[currentSelectedDate]?.[shift.shift_id] || shift.exception_status || 'active';
          tr.innerHTML = `
            <td>${shift.start_time} - ${shift.end_time}</td>
            <td>${shift.tutor_name}</td>
            <td>${shift.courses_taught || "None"}</td>
            <td id="radios-${shift.shift_id}">
                <label>
                    <input type="radio" name="status-${shift.shift_id}" value="active" 
                        ${currentStatus === 'active' ? 'checked' : ''} 
                        onchange="queueStatusChange(${shift.shift_id}, 'active')"> 
                    Active
                </label>
                <label>
                    <input type="radio" name="status-${shift.shift_id}" value="canceled" 
                        ${currentStatus === 'canceled' ? 'checked' : ''} 
                        onchange="queueStatusChange(${shift.shift_id}, 'canceled')"> 
                    Canceled
                </label>
            </td>
        `;
          tbody.appendChild(tr);
          tbody.appendChild(tr);
        });
      }

      function updateQueueUI() {
        const btn = document.getElementById('submit-btn');
         const count = Object.values(pendingChanges).reduce((sum, shifts) => sum + Object.keys(shifts).length, 0)
        btn.innerText = `Submit ${count} Changes`;
        btn.disabled = count === 0;
        btn.style.opacity = count === 0 ? "0.5" : "1";
        btn.style.cursor = count === 0 ? "default" : "pointer";

        // ew.
        if (document.getElementById('viz-title').innerText === "Pending Changes") {
          renderPendingList();
        }
      }

      async function toggleVisualizer(mode) {
        const title = document.getElementById('viz-title');
        const content = document.getElementById('viz-content');

        if (mode === 'pending') {
          title.innerText = "Pending Changes";
          console.log("Hi");
          renderPendingList();
        } else {
          title.innerText = "All Cancellations" ;
          content.innerHTML = "Loading...";

          try {
            const resp = await fetch('/api/exceptions/all');
            const data = await resp.json();

            if (data.length === 0) {
              content.innerHTML = "No cancellations found in database.";
              return;
            }

            let html = `<table><tr><th>Date</th><th>Tutor</th><th>Status</th></tr>`;
            data.forEach(ex => {
              html += `<tr><td>${ex.target_date}</td><td>${ex.tutor_name}</td><td>${ex.status}</td></tr>`;
            });
            content.innerHTML = html + `</table>`;
          } catch (e) {
            content.innerHTML = "Error loading cancellations.";
          }
        }
      }

      function renderPendingList() {
        const content = document.getElementById('viz-content');

        let totalCount = 0;
        let list = "<ul>";

        for (const [date, shifts] of Object.entries(pendingChanges).sort((a,b) => a[0].localeCompare(b[0]))) {
          if (Object.keys(shifts).length === 0) continue;

          list += `<li style="list-style:none; margin-top:8px;"><strong>${date}</strong><ul>`;          
          for (const [id, status] of Object.entries(shifts)) {
            totalCount++;
            const foundShift = (loaded[date] || []).find(item => item.shift_id == id);
            let label;
            if (foundShift) {
              label = `${foundShift.tutor_name}'s shift (${foundShift.start_time}-${foundShift.end_time})`;
            } 
            else {
              label = `Shift ID ${id}`;
            }
            list += `<li>${label} set to <strong>${status}  </strong>`;
            list += `<button onclick="popfromqueue('${date}','${id}')">&times;</button></li>`;
          }
          list += "</ul></li>";
        }
        list += "</ul>";

        if (totalCount === 0) {
          content.innerHTML = "No pending changes found.";
        } 
        else {
          content.innerHTML = list;
        }
      }

      function popfromqueue(date, id){
        let label;
        const foundShift = (loaded[date] || []).find(item => item.shift_id == id);
        if (foundShift) {
          label = `${foundShift.tutor_name}'s shift on ${date}`; 
        } 
        else {
          label = `Shift ID ${id} on ${date}`;
        }

        if (confirm(`Remove ${label}?`)) {
          delete pendingChanges[date][id];
          if (Object.keys(pendingChanges[date]).length === 0){
            delete pendingChanges[date];
          }
          //fix visual if exists
          fixDisplay(id);
          //re-draw list of pending
          renderPendingList();
          //reset button number to -1 or to greyed out
          updateQueueUI();
        }
      }

      function queueStatusChange(shiftId, status) {
        const defaultStatus = (loaded[currentSelectedDate] || []).find(item => item.shift_id == shiftId).exception_status || 'active';
        if (status === defaultStatus) {
          if (pendingChanges[currentSelectedDate]) {
            delete pendingChanges[currentSelectedDate][shiftId];
          }
        }
        else {
          if (!pendingChanges[currentSelectedDate]){
            pendingChanges[currentSelectedDate] = {};
          }
          pendingChanges[currentSelectedDate][shiftId] = status;
        }
        updateQueueUI();
        console.log("pending:", pendingChanges);
      }

      // if a queued elem is canceled, reset the radio box!
      function fixDisplay(id){
        const foundShift = (loaded[currentSelectedDate] || []).find(item => item.shift_id == id);
        if (foundShift){
          let originalStatus = foundShift.exception_status;
          if (originalStatus == null) {
            originalStatus = "active";
          }

          // 3. Find the specific radio button with that value and check it
          const selector = `input[name="status-${id}"][value="${originalStatus}"]`;
          const radioBtn = document.querySelector(selector);

          if (radioBtn) {
            radioBtn.checked = true;
          }
        }
      }
      // prompt for confirmation, push to api!
      async function updateCancellations() {
        const dates = Object.keys(pendingChanges).filter(d => Object.keys(pendingChanges[d]).length > 0);
        const totalCount = dates.reduce((sum, d) => sum + Object.keys(pendingChanges[d]).length, 0);
        if (totalCount === 0) return alert("No updates queued...");

        const confirmed = confirm(`Submit ${totalCount} changes across ${dates.length} date(s): ${dates.join(", ")}?`);

        if (confirmed) {
          try {
            let allSucceeded = true;
            for (const date of dates) {
              const response = await fetch('/api/batch_update_exceptions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  date: date,
                  updates: pendingChanges[date]
                })
              });
              if (!response.ok) {
                allSucceeded = false;
                return;
              }
            }
            alert("All cancelations submitted successfully!")
            for (const date of dates) { 
              delete pendingChanges[date]; 
            }
            toggleVisualizer('allcancel');
            const newDate = new Date(currentSelectedDate);
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            loadStaffDashboard(currentSelectedDate, days[newDate.getUTCDay()]);
            updateQueueUI();
          } catch (err) {
            console.error(err);
            alert("an error occcured, please try again?");
          }
        }
      }


      async function loadStaffDashboardalt() {
        return;
        const response = await fetch('/api/shifts/today');
        const shifts = await response.json();

        const tbody = document.getElementById('staff-table-body');
        tbody.innerHTML = '';


        shifts.forEach(shift => {
          const tr = document.createElement('tr');
          tr.innerHTML = `
                    <td>${shift.start_time} - ${shift.end_time}</td>
                    <td>${shift.tutor}</td>
                    <td>${shift.courses || "None"}</td>
                    <td>
                    </td>
                `;
          tbody.appendChild(tr);
        });
      }

      async function updateStatus(shiftId, newStatus) {
        let finalStatus = newStatus;

        if (newStatus === "Custom") {
          const customValue = prompt("Enter custom status:");

          if (!customValue) {
            const d = new Date(currentSelectedDate);
            const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
            loadStaffDashboard(currentSelectedDate, days[d.getUTCDay()]); 
            return;
          }
          finalStatus = customValue;
        }

        await fetch('/api/update_live_status', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ shift_id: shiftId, status: finalStatus })
        });
        console.log(`Updated shift ${shiftId} to ${finalStatus}`);
      }
      const d = new Date(currentSelectedDate);
      const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
      loadStaffDashboard(currentSelectedDate, days[d.getUTCDay()]); 
    </script>
</body>
</html>
